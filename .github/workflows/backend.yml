name: Set up shared database
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-slim
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      SUPABASE_POOLER_HOST: aws-0-us-east-1.pooler.supabase.com
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Create tables and permissions
        run: |
          curl --fail --silent --show-error https://supabase-downloads.s3-ap-southeast-1.amazonaws.com/prod/ssl/prod-ca-2021.crt --output "$RUNNER_TEMP/supabase-ca.crt"
          node --input-type=module <<'JS'
          import { spawnSync } from 'node:child_process';
          const { SUPABASE_PROJECT_ID: ref, SUPABASE_DB_PASSWORD: password, SUPABASE_POOLER_HOST: host } = process.env;
          if (!ref || !password || !host) throw new Error('Missing database configuration.');
          const encodedPassword = encodeURIComponent(password);
          const certificate = encodeURIComponent(`${process.env.RUNNER_TEMP}/supabase-ca.crt`);
          const databaseUrl = `postgresql://postgres.${ref}:${encodedPassword}@${host}:5432/postgres?sslmode=verify-full&sslrootcert=${certificate}`;
          console.log(`::add-mask::${encodedPassword}`);
          console.log(`::add-mask::${databaseUrl}`);
          const result = spawnSync('supabase', ['db', 'push', '--db-url', databaseUrl], { stdio: 'inherit' });
          if (result.error) throw result.error;
          process.exit(result.status ?? 1);
          JS
      - name: Deploy song matching
        run: supabase functions deploy song-api --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt --use-api
